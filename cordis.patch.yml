# dsh-plugin-zen-useragent
#
# ── v1.4.0 布局说明 ────────────────────────────────────────────────────
# 不再禁用/替换原生 llm-pi-ai 行。旧版「disabled: true + 同名 insert」会在
# 组合后的 entry 列表里产生两条 id=llm-pi-ai 的行；dsh-config-editor 的
# ConfigEditor.edit 用 flatten(composeEntries(...)).find() 取第一条（被禁用的
# 幽灵行，config 为空 {}），永远不等于编辑后的值，因此模型页（Models）对
# llm-pi-ai 的任何添加/删除/修改都报 "Configuration for ... is overridden by
# a home patch or command-line overlay"，自定义模型管理彻底不可用。
#
# 本版改为：原生 llm-pi-ai 保持单行、不做任何替换，直接挂载磁盘上已补丁的
# 原生模块（id 不变 → 模型页的 settings 命名空间 / adapter 查找行为不变）；
# 补丁逻辑拆到独立入口 zen-useragent，每次启动幂等执行：
#
#   1) 唯一 llm-pi-ai 行 → 模型页可正常增删改 provider（429/400/403 修复
#      通过 provider headers / 带 opencode 的 UA 生效）；
#   2) zen-useragent 行在模块加载时对 dsh-llm-pi-ai 的 requestHeaders 与
#      pi-ai openai-completions.js 落盘补丁（幂等，带标记注释，永不抛错）；
#   3) 时序说明：加载器并行导入所有入口模块，若启动时文件恰为未补丁状态
#      （全新安装后的第一次启动，或 DSH 升级把文件还原后的第一次启动），
#      该次启动仍按原生行为运行；补丁当次落盘，重启后即生效。此后每次
#      启动都是「already patched」，零额外开销。
- insert:
    - id: zen-useragent
      name: 'dsh-plugin-zen-useragent'